name: FB-IG Sync & Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install requests Pillow

      - name: Sync FB posts
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python scripts/sync_facebook.py

      - name: Regenerate sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit changes
        run: |
          git config user.name "Flow's Table Auto-Sync"
          git config user.email "flowstable.th@gmail.com"
          git add assets/data/posts.json assets/data/page_stats.json _data/reels.json assets/photos/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-sync FB posts + sitemap"
          git push

      - name: Deploy to Vercel
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set, skipping deploy"
            exit 0
          fi
          npm install -g vercel@54
          VERCEL_TOKEN="$VERCEL_TOKEN" vercel deploy --prod --yes
