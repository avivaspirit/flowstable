name: Scheduled Facebook & Instagram Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run sync script
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python scripts/sync_facebook.py

      - name: Commit and push changes
        run: |
          git config user.name "Flow's Table Auto-Sync"
          git config user.email "flowstable.th@gmail.com"
          git add assets/data/posts.json assets/data/page_stats.json assets/photos/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-sync latest Facebook page posts"
          git push

      - name: Deploy to Vercel
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set; skipping deploy (connect GitHub in Vercel or add secret)"
            exit 0
          fi
          npm install -g vercel@54.9.1
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
