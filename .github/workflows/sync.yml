name: Scheduled Facebook & Instagram Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run sync script
        run: python scripts/sync_facebook.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Flow's Table Auto-Sync"
          git config --global user.email "flowstable.th@gmail.com"
          git add assets/data/posts.json assets/photos/
          git commit -m "Auto-sync latest Facebook page posts [skip ci]" || echo "No changes to commit"
          git push
